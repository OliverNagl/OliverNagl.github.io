<!DOCTYPE html>
<html lang="en" data-page="{{ page_id }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="{{ base }}assets/app.css">
<link rel="alternate" type="application/rss+xml" title="Research radar" href="{{ base }}feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23a4573b' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%23a4573b'/></svg>">
<script>
  /* Applied before first paint so a dark-mode reader never sees a white flash. */
  try {
    var t = localStorage.getItem("radar-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" href="{{ base }}index.html">Research&nbsp;radar<span>.</span></a>
    <nav class="nav">
      <a href="{{ base }}index.html"    {% if page_id == 'week' %}aria-current="page"{% endif %}>This week</a>
      <a href="{{ base }}archive.html"  {% if page_id == 'archive' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ base }}tuning.html"   {% if page_id == 'tuning' %}aria-current="page"{% endif %}>Tuning</a>
      <a href="{{ base }}projects.html" {% if page_id == 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <button class="theme-toggle" type="button" id="theme-toggle"
              aria-label="Toggle colour scheme" title="Toggle colour scheme">◐</button>
    </nav>
  </div>
</header>

<main class="page">
{% block content %}{% endblock %}

  <footer class="foot">
    <span>{{ owner }}</span>
    <a href="mailto:{{ email }}">{{ email }}</a>
    <a href="https://github.com/{{ github }}">GitHub</a>
    {% if linkedin %}<a href="{{ linkedin }}">LinkedIn</a>{% endif %}
    <span class="spacer"></span>
    <a href="{{ base }}feed.xml">RSS</a>
    <a href="https://github.com/{{ github }}/{{ github }}.github.io">Source</a>
  </footer>
</main>

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      var explicit = root.getAttribute("data-theme");
      var dark = explicit
        ? explicit === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("radar-theme", next); } catch (e) {}
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
