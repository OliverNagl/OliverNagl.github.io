# Papers that SHOULD have surfaced.
#
# This file is the steering wheel. Whenever you find something late — a colleague forwarded
# it, you hit it three weeks after it mattered — add it here and run `radar eval`. The
# report tells you the exact rule that dropped it and what recovering it would cost in
# extra noise.
#
# Fields:
#   doi     the DOI, or an arXiv id like 2401.12345 (use `arxiv:` or a bare id)
#   expect  front_page  it should have been one of the week's top picks
#           shortlist   it should at least have been screened and appear in the backlog
#           surfaced    it should have got past the prefilter at all
#   note    why it mattered, and how you actually found it. Shown in the report; this is
#           the field you will thank yourself for in six months.
#
# Add entries freely — a gold set of five is already useful, and one of thirty is enough to
# tune against with confidence. Judge changes by this file and by the monthly recall audit,
# never by whether this week's front page happens to look good.

papers:
  # --- seeds, so the harness is testable before your own list arrives -----------------
  # These are known-relevant papers in the target problem space. Replace them with real
  # misses as you accumulate them; they are here to prove the machinery works, not to
  # define what "good" means.

  - doi: 10.1038/s41586-023-06415-8
    expect: front_page
    note: "RFdiffusion. If the filter cannot surface this, something is badly wrong."

  - doi: 10.1126/science.add2187
    expect: front_page
    note: "ProteinMPNN. Same reasoning — a canary, not a real miss."

  - doi: 10.1038/s41586-024-07601-y
    expect: shortlist
    note: "Designed soluble analogues of membrane proteins; King/Baker adjacent."

  # --- your real misses go below here ------------------------------------------------
