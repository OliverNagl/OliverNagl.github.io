# Papers that SHOULD have surfaced.
#
# This file is the steering wheel. Whenever you find something late — a colleague forwarded
# it, you hit it three weeks after it mattered — add it here and run `radar eval`. The
# report names the exact rule that dropped it and prices what recovering it would cost in
# extra noise.
#
# Fields:
#   doi     the DOI, or an arXiv id like 2401.12345
#   expect  front_page  it should have been one of the week's top picks
#           shortlist   it should at least be screened and reach the backlog
#           surfaced    it should have got past the prefilter at all
#   note    why it mattered, and how you actually found it
#
# Judge changes by this file and by `radar audit`, never by whether this week's front page
# happens to look good — a front page that looks good is what an overfitted filter produces.

