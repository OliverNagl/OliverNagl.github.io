# --- deliberately excluded ----------------------------------------------------------
#   10.1038/s43587-026-01150-x  "Delayed molecular aging ... in exercise-trained human
#   muscle" (Nature Aging). Exercise physiology sits outside all nine categories, and
#   OpenAlex carries no abstract for it, so the filter would be judging a title alone.
#   Dropped by hand rather than distorting the taxonomy to catch one outlier.
#
# --- in the CSV but not reachable by this radar -------------------------------------
# Left here as documentation of a real coverage gap, not as failing entries.
#
#   https://www.science.org/content/blog-post/benchmarking-benchmarks   (In the Pipeline blog)
#   https://openbind.uk/news/blog-openbinds-first-release-...           (company blog)
#   https://openreview.net/forum?id=kIe6nCvXzA                          (OpenReview only)
#   https://biohub.ai/esm/protein/about                                 (product page)
#
# None of these are indexed by bioRxiv, arXiv, PubMed or OpenAlex, so no amount of filter
# tuning will surface them. See README, "What the radar cannot reach".
#
# Two Cell-family PIIs could not be resolved to DOIs automatically (cell.com blocks
# scripted access and neither Crossref nor Europe PMC indexes the PII):
#   https://www.cell.com/cell/fulltext/S0092-8674(26)00932-3
#   https://www.cell.com/structure/fulltext/S0969-2126(26)00104-8
# Add them by DOI and they will be checked like the rest.
