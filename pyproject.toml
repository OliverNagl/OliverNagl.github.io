[project]
name = "research-radar"
version = "0.1.0"
description = "Weekly automated literature radar for protein design and nanomaterials"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.scripts]
radar = "radar.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "dukpy>=0.3"]   # dukpy runs the front-end JS in the test suite

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
