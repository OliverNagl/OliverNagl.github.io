# Guaranteed representation in the blindspot sample (spec §4.2). Soft-matter
# self-assembly physics is a standing blindspot for anyone working on capsids.
blindspot_quota:
  arxiv:cond-mat.soft: 25
  arxiv:physics.bio-ph: 20
  arxiv:q-bio.QM: 10
  biorxiv_other: 40
blindspot_sample_size: 150
