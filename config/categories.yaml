# The taxonomy and every lexical rule. Retargeting the radar = editing this file.
# All matching is case-insensitive substring matching on "title + abstract".
# Substrings are deliberate: "self-assembl" catches assembly/assembling/assembled.

# Tier 1 — skips the prefilter entirely. Keep this list short and specific.
hard_include_phrases:
  - de novo design
  - de novo protein
  - protein nanoparticle
  - nanocage
  - nanoparticle immunogen
  - designed protein assembly
  - RFdiffusion
  - ProteinMPNN
  - AlphaFold3
  - AlphaProteo
  - protein design

# Tier 2 — a record needs at least one hit here to survive. Broad on purpose:
# recall first, precision second (spec §0.1).
must_any:
  - protein
  - peptide
  - enzyme
  - antibody
  - nanobody
  - capsid
  - virus
  - viral
  - nanoparticle
  - self-assembl
  - assembly
  - oligomer
  - fold
  - binder
  - epitope
  - antigen
  - immunogen
  - vaccine
  - rna
  - mrna
  - dna
  - nucleic acid
  - codon
  - translation
  - proteome
  - catalys
  - biosynthe
  - metabol
  - generative
  - molecular structure
  - display
  - aging
  - decoding
  - llm
  - structure prediction
  - cryo-em
  - crystal structure
  - molecular dynamics
  - diffusion model
  - generative model
  - flow matching
  - representation learning
  - equivariant
  - language model
  - deep learning
  - machine learning

# Tier 4 — excluded from the shortlist, KEPT in the blindspot pool (spec §4).
hard_exclude:
  - randomized controlled trial
  - randomised controlled trial
  - epidemiological surveillance
  - seroprevalence survey
  - crop yield
  - agronomic
  - soil microbiome
  - dietary intervention
  - questionnaire study
  - retrospective cohort
  - meta-analysis of trials

# Journal tiers feed the venue_tier ranking term (0.0 - 1.0).
venue_tiers:
  1.0: [Nature, Science, Cell]
  0.8: [Nature Methods, Nature Biotechnology, Nature Chemical Biology, Nature Nanotechnology,
        Nature Structural & Molecular Biology, Nature Materials, Immunity, Molecular Cell]
  0.6: [Nature Communications, Science Advances, PNAS, eLife, JACS,
        Journal of the American Chemical Society, ACS Nano, Angewandte Chemie]
  0.4: [Protein Science, Structure, Nucleic Acids Research, Bioinformatics, ACS Synthetic Biology,
        npj Vaccines, Cell Host & Microbe, Molecular Therapy, Journal of Virology, PLoS Computational Biology]
  0.2: [bioRxiv, medRxiv, arXiv, ChemRxiv]

# The general-CS gate (cs.LG / cs.AI / stat.ML / cs.CV cross-lists). Volume there is ~16x
# the rest of arXiv combined and most of it is not about molecules at all. Measured: with a
# single flat term list, 177 of 221 general-CS records cleared — useless as a filter.
#
# So a term alone is not enough unless it is decisive:
#   strong            transferable generative-modelling vocabulary; sufficient on its own
#   weak_needs_domain generic ML vocabulary; needs a domain term in the same abstract
#   domain            what makes an ML paper reach a protein-design radar at all
general_cs_gate:
  strong:
    - flow matching
    - discrete diffusion
    - latent diffusion
    - equivariant
    - SE(3)
    - classifier-free guidance
    - normalizing flow
    - score-based generative
    - diffusion model
  weak_needs_domain:
    - test-time
    - inference-time
    - denoising
    - graph neural network
    - active learning
    - uncertainty quantification
    - scaling law
    - preference optimization
    - preference optimisation
    - representation learning
    - transformer
    - attention
  domain:
    - protein
    - peptide
    - amino acid
    - molecul
    - chemistr
    - drug
    - ligand
    - biolog
    - biomolecul
    - crystal
    - conformation
    - docking
    - rna
    - mrna
    - dna
    - antibod
    - enzyme
    - material

categories:
  - id: ml-method
    name: ML methodology (transferable)
    weight: 1.0
    gate_general_cs: true        # cs.LG / cs.AI / stat.ML need a boost hit to survive
    description: >
      Domain-agnostic ML advances that transfer to structural biology: diffusion and flow
      matching, discrete and latent diffusion, guidance and inference-time steering, RL and
      preference optimisation, equivariant architectures, sampling, active learning,
      uncertainty, scaling behaviour.
    boost:
      flow matching: 3.0
      discrete diffusion: 3.0
      latent diffusion: 2.5
      equivariant: 2.5
      SE(3): 2.5
      classifier-free guidance: 2.0
      inference-time: 2.0
